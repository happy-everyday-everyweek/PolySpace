<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolySpace Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { height: 100vh; background: #1a1a2e; color: #e0e0e0; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; }
    .chat-header { padding: 12px 16px; border-bottom: 1px solid #2a2a4a; font-size: 14px; font-weight: 500; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.5; }
    .msg.user { align-self: flex-end; background: #6366f1; color: #fff; }
    .msg.assistant { align-self: flex-start; background: #16162a; border: 1px solid #2a2a4a; }
    .chat-input-area { padding: 12px; border-top: 1px solid #2a2a4a; display: flex; gap: 8px; }
    .chat-input { flex: 1; padding: 8px 12px; border: 1px solid #2a2a4a; border-radius: 8px; background: #16162a; color: #e0e0e0; font-size: 13px; outline: none; }
    .chat-input:focus { border-color: #6366f1; }
    .chat-send { padding: 8px 16px; background: #6366f1; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .chat-send:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <div class="chat-header">PolySpace AI</div>
  <div class="chat-messages" id="messages"></div>
  <div class="chat-input-area">
    <input class="chat-input" id="input" placeholder="输入消息..." />
    <button class="chat-send" id="send">发送</button>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
