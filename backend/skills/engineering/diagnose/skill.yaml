name: diagnose
description: Disciplined diagnosis loop for hard bugs and performance regressions. Reproduce -> minimise -> hypothesise -> instrument -> fix -> regression-test. Use when user says "diagnose this" / "debug this", reports a bug, says something is broken/throwing/failing, or describes a performance regression.
version: "1.0.0"
author: matt-pocock
category: coding
entry_point: main.py
parameters:
  problem_description:
    type: string
    description: Description of the bug or performance regression to diagnose
  context:
    type: string
    description: Additional context such as error messages, stack traces, or reproduction steps
    default: ""
