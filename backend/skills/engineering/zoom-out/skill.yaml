name: zoom-out
description: Tell the agent to zoom out and give broader context or a higher-level perspective. Use when you're unfamiliar with a section of code or need to understand how it fits into the bigger picture.
version: "1.0.0"
author: matt-pocock
category: coding
entry_point: main.py
parameters:
  code_area:
    type: string
    description: The code area or module to zoom out from
  question:
    type: string
    description: What you want to understand about the broader context
    default: ""
