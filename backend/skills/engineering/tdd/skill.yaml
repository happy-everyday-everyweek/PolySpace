name: tdd
description: Test-driven development with red-green-refactor loop. Use when user wants to build features or fix bugs using TDD, mentions "red-green-refactor", wants integration tests, or asks for test-first development.
version: "1.0.0"
author: matt-pocock
category: coding
entry_point: main.py
parameters:
  feature_description:
    type: string
    description: The feature or bug fix to implement using TDD
  interface_requirements:
    type: string
    description: Public interface requirements or constraints
    default: ""
