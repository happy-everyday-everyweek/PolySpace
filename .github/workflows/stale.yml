name: Stale

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark Stale Issues & PRs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 7
          days-before-pr-stale: 14
          days-before-pr-close: 5
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            any activity for 30 days. It will be closed in 7 days if no further
            activity occurs.
          close-issue-message: >
            This issue was closed because it has been inactive for 7 days since
            being marked as stale.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has
            not had any activity for 14 days. It will be closed in 5 days if no
            further activity occurs.
          close-pr-message: >
            This pull request was closed because it has been inactive for 5 days
            since being marked as stale.
          exempt-issue-labels: pinned,security,enhancement
          exempt-pr-labels: pinned,security
          remove-stale-when-updated: true
          delete-branch: false
